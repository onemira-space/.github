name: Auto Add to Project v2

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    name: Auto Add & Set Fields in Project v2
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue or PR to Project v2
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/onemira-space/projects/2
          github-token: ${{ secrets.PROJECT_PAT }}
